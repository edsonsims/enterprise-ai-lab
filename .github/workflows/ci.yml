name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  historical-case-inventory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -e .
      - name: Historical inventory and recorded knowledge-case contracts
        run: python -W error::ResourceWarning -m unittest discover -s tests/case_studies -v
      - name: Inspect three frozen reports without executing experiments
        run: python -m enterprise_ai_lab.case_studies inspect --repository .
      - name: Verify recorded knowledge case without starting services
        run: python scripts/verify_knowledge_case.py --report reports/case-knowledge-v1/demo.json

  local-admin-portal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      RUN_ADMIN_INTEGRATION: '1'
      RUN_ADMIN_BROWSER: '1'
      IDENTITY_LAB_DIR: ${{ github.workspace }}/.local/identity-boundary-lab
      NODE_BINARY: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edsonsims/identity-boundary-lab
          ref: 92a6688e6df862934d53201a6ac39d8fba410a52
          path: .local/identity-boundary-lab
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-approval.lock
      - run: python -m pip install -r requirements-approval.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - working-directory: .local/identity-boundary-lab
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Signed admin boundary, real SQLite, actual browser and interrupted commit recovery
        run: python -W error::ResourceWarning -m pytest tests/admin -q

  local-cpu-inference-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -e .
      - name: Model-free strict contracts and actual controlled process boundaries
        run: python -W error::ResourceWarning -m unittest discover -s tests/edge -v
      - name: Recompute recorded CPU evidence without loading a model
        run: >-
          python -m enterprise_ai_lab.edge verify-report
          --report reports/edge-v1/cpu-qwen-v1.json

  core-wheel-network-denial:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Explicit connected build-host setup
        run: python -m pip install setuptools==84.2.1
      - name: Strict bundle contracts
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests/offline_bundle -v
      - name: Build without resolution or downloads
        run: >-
          python -m pip wheel --no-index --no-deps --no-build-isolation .
          --wheel-dir .local/core-wheel
      - name: Actual fresh install and lexical demo under macOS network denial
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheels = sorted(Path('.local/core-wheel').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected exactly one newly built core wheel')
          subprocess.run([
              sys.executable, 'scripts/offline_bundle_demo.py',
              '--wheel', str(wheels[0]),
              '--work-dir', '.local/offline-install-demo',
              '--out', 'reports/local/offline-install-demo.json',
          ], check=True)
          PY

  fictional-activity-roi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -e .
      - name: Portable strict core-wheel inventory contracts
        run: python -W error::ResourceWarning -m unittest discover -s tests/offline_bundle -v
      - name: Tenant snapshot, exact scenario arithmetic and actual CLI boundaries
        run: python -W error::ResourceWarning -m unittest discover -s tests/health -v
      - name: Offline fictional activity and modeled ROI story
        run: >-
          python scripts/health_demo.py
          --work-dir .local/ci-health --out reports/local/ci-health.json

  fictional-cost-ledger:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -e .
      - name: Exact fictional arithmetic and actual SQLite/process boundaries
        run: python -W error::ResourceWarning -m unittest discover -s tests/costs -v
      - name: Offline tenant ledger and immutable statement story
        run: >-
          python -m enterprise_ai_lab.costs demo
          --work-dir .local/ci-costs --out reports/local/ci-costs.json

  bounded-mcp-failover:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-mcp.lock
      - run: python -m pip install -r requirements-mcp.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - name: Absolute budgets, terminal fences and actual owned-process faults
        run: python -m pytest tests/chaos -q
      - name: Offline official MCP failure and recovery experiment
        run: >-
          python -m enterprise_ai_lab.chaos demo
          --work-dir .local/ci-chaos --out reports/local/ci-chaos.json

  scoped-privacy-proxy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      RUN_PRIVACY_INTEGRATION: '1'
      IDENTITY_LAB_DIR: ${{ github.workspace }}/.local/identity-boundary-lab
      NODE_BINARY: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edsonsims/identity-boundary-lab
          ref: 392f85bdfcbd5304ef515fe5802a9e67ec5a39a3
          path: .local/identity-boundary-lab
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-approval.lock
      - run: python -m pip install -r requirements-approval.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - working-directory: .local/identity-boundary-lab
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Real issuer, local HTTP, scoped maps, collision, expiry and log boundaries
        run: python -m pytest tests/privacy -q
      - name: Recompute the frozen development evaluation with matching source
        run: >-
          python -m enterprise_ai_lab.privacy_proxy verify-report
          reports/privacy-v1/evaluation.json
      - name: Reproduce fictional text through actual local processes
        run: >-
          python -m enterprise_ai_lab.privacy_proxy demo
          --identity-dir "$IDENTITY_LAB_DIR" --node node
          --work-dir .local/ci-privacy --out reports/local/ci-privacy.json

  sqlite-mcp-gateway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-mcp.lock
      - run: python -m pip install -r requirements-mcp.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - name: Real official stdio clients, SQLite permissions, audit, deadlines and recovery
        run: python -m pytest tests/gateway -q
      - name: Offline synthetic gateway story
        run: >-
          python -m enterprise_ai_lab.mcp_gateway demo
          --work-dir .local/ci-gateway --out reports/local/ci-gateway.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m enterprise_ai_lab demo --output reports/reference --seed 42
      - run: git diff --exit-code -- reports/reference

  authenticated-rag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      RUN_RAG_INTEGRATION: '1'
      RUN_PUBLICATION_INTEGRATION: '1'
      TEMPORAL_CLI: ${{ github.workspace }}/.local/temporal-bin/temporal
      RAG_MODEL_DIR: ${{ github.workspace }}/.local/models/minilm
      IDENTITY_LAB_DIR: ${{ github.workspace }}/.local/identity-boundary-lab
      NODE_BINARY: node
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edsonsims/identity-boundary-lab
          ref: 70e663c69ad96997c394581fa9df33487d2e3390
          path: .local/identity-boundary-lab
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-rag.lock
            requirements-ingestion.lock
            requirements-approval.lock
      - name: Real local OCR engine and English language data
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements-rag.lock -r requirements-ingestion.lock -r requirements-approval.lock
      - run: python -m pip install --no-deps -e .
      - working-directory: .local/identity-boundary-lab
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Explicit pinned public model bootstrap
        run: python -m enterprise_ai_lab.rag.models bootstrap --model-dir "$RAG_MODEL_DIR"
      - name: Explicit pinned Temporal bootstrap for connected publication
        run: python -m enterprise_ai_lab.approval.bootstrap bootstrap --directory .local/temporal-bin
      - name: Real issuer, HTTP, ONNX and persisted-vector tests
        run: python -m pytest tests/rag tests/ingestion tests/publication -q
      - name: Reproduce the connected extractive story
        run: >-
          python -m enterprise_ai_lab.rag demo
          --identity-dir "$IDENTITY_LAB_DIR" --model-dir "$RAG_MODEL_DIR"
          --store .local/ci-rag-store --out reports/local/ci-rag-demo.json
      - name: Check observed permissions and persisted content
        run: python scripts/check_rag_demo.py reports/local/ci-rag-demo.json
      - name: Public native PDF and actual OCR through the authenticated RAG
        run: >-
          python -m enterprise_ai_lab.rag pdf-demo
          --manifest public-data/pdf-v1/ingestion.json
          --identity-dir "$IDENTITY_LAB_DIR" --model-dir "$RAG_MODEL_DIR"
          --store .local/ci-pdf-store --out reports/local/ci-pdf-demo.json

  durable-approval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      RUN_APPROVAL_INTEGRATION: '1'
      TEMPORAL_CLI: ${{ github.workspace }}/.local/temporal-bin/temporal
      IDENTITY_LAB_DIR: ${{ github.workspace }}/.local/identity-boundary-lab
      NODE_BINARY: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edsonsims/identity-boundary-lab
          ref: 70e663c69ad96997c394581fa9df33487d2e3390
          path: .local/identity-boundary-lab
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-approval.lock
      - run: python -m pip install -r requirements-approval.lock
      - run: python -m pip install --no-deps -e .
      - working-directory: .local/identity-boundary-lab
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Explicit anonymous hash-verified official Temporal bootstrap
        run: python -m enterprise_ai_lab.approval.bootstrap bootstrap --directory .local/temporal-bin
      - name: Real persistent Temporal, signed OAuth HTTP, crash, timer and replay tests
        run: python -m pytest tests/approval -q

  human-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      RUN_REVIEW_INTEGRATION: '1'
      RUN_REVIEW_BROWSER: '1'
      RUN_REVIEW_DIAGNOSTIC: '1'
      REVIEW_FAILURE_REPORT: ${{ github.workspace }}/reports/local/review-failure.json
      TEMPORAL_CLI: ${{ github.workspace }}/.local/temporal-bin/temporal
      RAG_MODEL_DIR: ${{ github.workspace }}/.local/models/minilm
      IDENTITY_LAB_DIR: ${{ github.workspace }}/.local/identity-boundary-lab
      NODE_BINARY: node
      HF_HUB_DISABLE_TELEMETRY: '1'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edsonsims/identity-boundary-lab
          ref: 70e663c69ad96997c394581fa9df33487d2e3390
          path: .local/identity-boundary-lab
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-rag.lock
            requirements-ingestion.lock
            requirements-approval.lock
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements-rag.lock -r requirements-ingestion.lock -r requirements-approval.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - working-directory: .local/identity-boundary-lab
        run: |
          npm ci --ignore-scripts
          npm run build
      - run: python -m enterprise_ai_lab.rag.models bootstrap --model-dir "$RAG_MODEL_DIR"
      - run: python -m enterprise_ai_lab.approval.bootstrap bootstrap --directory .local/temporal-bin
      - name: Actual browser login, permitted PDF pages, decisions, audit and published RAG
        run: python -m pytest tests/review -q
      - name: Validate and export only finite failure metadata
        id: failure-metadata
        if: failure()
        run: >-
          python scripts/export_review_failure.py
          reports/local/review-failure.json reports/local/review-failure-upload.json
          >> "$GITHUB_OUTPUT"
      - name: Retain safe failure metadata for diagnosis
        if: failure() && steps.failure-metadata.outputs.valid == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-failure-python-${{ matrix.python }}
          path: reports/local/review-failure-upload.json
          if-no-files-found: error
          retention-days: 7
